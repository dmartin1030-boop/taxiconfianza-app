<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mis vehículos | TaxiConfianza</title>

  <link rel="stylesheet" href="css/dashboard-theme.css" />

  <style>
    .main { padding: 24px 32px 40px !important; }
    .card { padding: 22px 26px !important; }

    .table { width:100%; border-collapse:collapse; min-width:760px; }
    .table th, .table td {
      padding: 11px 12px;
      border-bottom: 1px solid var(--border);
      text-align: left;
      font-size: 13px;
      vertical-align: middle;
    }
    .table th { color: var(--muted); font-weight: 700; }
    .right { text-align: right !important; }

    .field label { display:block; font-size:13px; color:var(--muted); margin:0 0 7px; font-weight:500; }
    .input, select {
      width: 100%;
      background: rgba(255,255,255,.04);
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 12px;
      padding: 11px 14px;
      color: var(--text);
      outline: none;
      font-size: 14px;
      font-family: var(--font);
      box-sizing: border-box;
      color-scheme: dark;
      transition: border-color .15s;
    }
    .input:focus, select:focus { border-color: rgba(251,191,36,.45); }
    select option { background: #111c33; color: #e5e7eb; }

    .two { display:grid; grid-template-columns:1fr; gap:12px; }
    @media(min-width:600px) { .two { grid-template-columns:1fr 1fr; } }

    .actions-row { display:flex; gap:10px; justify-content:flex-end; flex-wrap:wrap; margin-top:16px; }
    .danger { background: rgba(239,68,68,.12); border-color: rgba(239,68,68,.25); }
    .muted  { color: var(--muted); font-size:13px; }

    .placa-badge {
      display: inline-block;
      font-family: monospace;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .06em;
      background: rgba(251,191,36,.10);
      border: 1px solid rgba(251,191,36,.25);
      color: #fbbf24;
      padding: 3px 9px;
      border-radius: 7px;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="logo">TC</div>
        <div>
          <h1>TaxiConfianza</h1>
          <p>Panel Propietario</p>
        </div>
      </div>

      <nav class="nav" aria-label="Navegación del propietario">
        <a href="dashboard-propietario.html">
          <svg class="ico" viewBox="0 0 24 24" fill="none">
            <path d="M4 10.5L12 4l8 6.5V20a1.5 1.5 0 0 1-1.5 1.5H5.5A1.5 1.5 0 0 1 4 20v-9.5Z" stroke="currentColor" stroke-width="1.6"/>
          </svg>
          Dashboard
        </a>
        <a href="publicar-oferta.html">
          <svg class="ico" viewBox="0 0 24 24" fill="none">
            <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          </svg>
          Publicar oferta
        </a>
        <a class="active" href="mis-vehiculos.html" aria-current="page">
          <svg class="ico" viewBox="0 0 24 24" fill="none">
            <path d="M7 16l-2 2m2-2 2 2m-2-2V8m10 8 2 2m-2-2-2 2m2-2V8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
            <path d="M6 8h12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          </svg>
          Mis vehículos
        </a>
      </nav>

      <div class="sep"></div>
      <button class="btn danger" id="btnLogout" style="width:100%; justify-content:center">Salir</button>
    </aside>

    <div class="overlay" id="overlay"></div>

    <main class="main">
      <header class="topbar">
        <div class="left">
          <h2 class="title">Mis vehículos</h2>
          <p class="subtitle">Registra los taxis de tu flota para poder publicar ofertas.</p>
        </div>
        <div class="top-actions">
          <button class="btn primary" id="btnRefresh" type="button">Actualizar</button>
        </div>
      </header>

      <section class="grid">
        <!-- Tabla -->
        <article class="card">
          <div class="row" style="margin-bottom:12px;">
            <div class="muted">Total registrados: <strong id="count">0</strong></div>
            <div class="muted" id="msg"></div>
          </div>

          <div style="overflow:auto; border-radius:12px;">
            <table class="table">
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Placa</th>
                  <th>Marca</th>
                  <th>Modelo</th>
                  <th>Año</th>
                  <th>Combustible</th>
                  <th class="right">Acciones</th>
                </tr>
              </thead>
              <tbody id="tbl">
                <tr><td colspan="7" class="muted">Cargando…</td></tr>
              </tbody>
            </table>
          </div>
        </article>

        <!-- Formulario -->
        <article class="card">
          <h3 style="margin:0 0 4px">Registrar vehículo</h3>
          <p class="muted" style="margin:0 0 20px">Solo la placa es obligatoria.</p>

          <div class="field">
            <label>Placa *</label>
            <input class="input" id="placa" placeholder="Ej: ABC123" maxlength="8" />
          </div>

          <div class="two" style="margin-top:12px;">
            <div class="field">
              <label>Marca</label>
              <input class="input" id="marca" placeholder="Ej: Chevrolet" />
            </div>
            <div class="field">
              <label>Modelo / Referencia</label>
              <input class="input" id="modelo" placeholder="Ej: Spark GT, Sail" />
            </div>
          </div>

          <div class="two" style="margin-top:12px;">
            <div class="field">
              <label>Año</label>
              <input class="input" id="anio" type="number" min="2000" max="2030" placeholder="Ej: 2021" />
            </div>
            <div class="field">
              <label>Combustible</label>
              <select id="combustible">
                <option value="">Sin especificar</option>
                <option value="gasolina">Gasolina</option>
                <option value="gas">Gas natural (GNV)</option>
                <option value="hibrido">Híbrido</option>
                <option value="electrico">Eléctrico</option>
              </select>
            </div>
          </div>

          <div class="actions-row">
            <button class="btn" id="btnClear" type="button">Limpiar</button>
            <button class="btn primary" id="btnCreate" type="button">Guardar vehículo</button>
          </div>
        </article>
      </section>
    </main>
  </div>

  <script src="js/tc-session.js"></script>
  <script>
  const COMBUSTIBLE_LABEL = {
    gasolina: "Gasolina",
    gas:      "Gas natural (GNV)",
    hibrido:  "Híbrido",
    electrico:"Eléctrico",
  };

  const API = {
    list:   "/api/propietario/vehiculos",
    create: "/api/propietario/vehiculos",
    del:    (id) => `/api/propietario/vehiculos/${id}`,
  };

  function authHeaders() {
    const email = localStorage.getItem("user_email") || localStorage.getItem("email") || "";
    const tipo  = localStorage.getItem("user_tipo")  || localStorage.getItem("tipo")  || "";
    return { "Content-Type": "application/json", "X-User-Email": email, "X-User-Tipo": tipo };
  }

  function requireAuthOrStop() {
    const email = localStorage.getItem("user_email") || localStorage.getItem("email") || "";
    const tipo  = localStorage.getItem("user_tipo")  || localStorage.getItem("tipo")  || "";
    if (!email || !tipo) { alert("No hay sesión guardada. Inicia sesión primero."); return false; }
    return true;
  }

  const $ = (s) => document.querySelector(s);

  async function loadVehiculos() {
    if (!requireAuthOrStop()) return;
    $("#msg").textContent = "Cargando…";
    const res  = await fetch(API.list, { headers: authHeaders() });
    const json = await res.json();

    if (!json.ok) {
      $("#tbl").innerHTML = `<tr><td colspan="7" class="muted">No se pudo cargar</td></tr>`;
      $("#msg").textContent = json.error || "Error";
      return;
    }

    const data = json.data || [];
    $("#count").textContent = data.length;
    $("#msg").textContent   = "";

    if (!data.length) {
      $("#tbl").innerHTML = `<tr><td colspan="7" class="muted">No tienes vehículos registrados aún</td></tr>`;
      return;
    }

    const dash = `<span class="muted">—</span>`;
    $("#tbl").innerHTML = data.map(v => `
      <tr>
        <td style="color:var(--muted); font-size:12px">#${v.id}</td>
        <td><span class="placa-badge">${(v.placa || "").toUpperCase()}</span></td>
        <td>${v.marca  || dash}</td>
        <td>${v.modelo || dash}</td>
        <td>${v.anio   || dash}</td>
        <td>${COMBUSTIBLE_LABEL[v.combustible] || (v.combustible ? v.combustible : dash)}</td>
        <td class="right">
          <button class="btn danger" data-del="${v.id}" type="button">Eliminar</button>
        </td>
      </tr>
    `).join("");
  }

  async function createVehiculo() {
    if (!requireAuthOrStop()) return;

    const placa       = $("#placa").value.trim().toUpperCase();
    const marca       = $("#marca").value.trim() || null;
    const modelo      = $("#modelo").value.trim() || null;
    const anio        = $("#anio").value.trim();
    const combustible = $("#combustible").value || null;

    if (!placa) { alert("La placa es obligatoria."); return; }

    const btn = $("#btnCreate");
    btn.disabled = true;
    btn.textContent = "Guardando…";

    try {
      const res  = await fetch(API.create, {
        method: "POST",
        headers: authHeaders(),
        body: JSON.stringify({ placa, marca, modelo, anio: anio ? Number(anio) : null, combustible }),
      });
      const json = await res.json();

      if (!json.ok) { alert(json.error || "Error creando vehículo"); return; }

      alert("Vehículo registrado ✅");
      clearForm();
      await loadVehiculos();
    } catch (e) {
      console.error(e);
      alert("Error de conexión: " + e.message);
    } finally {
      btn.disabled = false;
      btn.textContent = "Guardar vehículo";
    }
  }

  async function deleteVehiculo(id) {
    if (!requireAuthOrStop()) return;
    if (!confirm("¿Eliminar este vehículo?")) return;
    const res  = await fetch(API.del(id), { method: "DELETE", headers: authHeaders() });
    const json = await res.json();
    if (!json.ok) { alert(json.error || "No se pudo eliminar"); return; }
    await loadVehiculos();
  }

  function clearForm() {
    ["#placa","#marca","#modelo","#anio"].forEach(id => { if ($(id)) $(id).value = ""; });
    if ($("#combustible")) $("#combustible").value = "";
  }

  $("#btnRefresh").addEventListener("click", loadVehiculos);
  $("#btnCreate").addEventListener("click", createVehiculo);
  $("#btnClear").addEventListener("click", clearForm);

  document.addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-del]");
    if (btn) deleteVehiculo(btn.getAttribute("data-del"));
  });

  loadVehiculos();
  </script>
</body>
</html>
